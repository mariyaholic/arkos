[package]
name = "arkos"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Arkos (mh-shimatsu-001): volume snapshot scanner, directory rollup, snapshot diff, and static treemap"
license = "MIT"

[features]
default = ["mft"]
mft = []
ipc = []

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
